name: Build PQCVPN_DD APK
on:
  push:
    branches: [ master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set PQCVPN_DD Logo
        run: |
          for size in hdpi mdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p ui/src/main/res/mipmap-$size
            cp pqc_dd.png ui/src/main/res/mipmap-$size/ic_launcher.png
            cp pqc_dd.png ui/src/main/res/mipmap-$size/ic_launcher_round.png
          done
          find ui/src/main/res/mipmap-hdpi ui/src/main/res/mipmap-mdpi ui/src/main/res/mipmap-xhdpi ui/src/main/res/mipmap-xxhdpi ui/src/main/res/mipmap-xxxhdpi -name "*.xml" -delete 2>/dev/null || true
      - name: Build APK
        run: ./gradlew assembleRelease
      - name: Sign APK
        run: |
          keytool -genkeypair -v -keystore pqcvpn.keystore -alias pqcvpn -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=PQCVPN_DD, OU=PQCVPN, O=PQCVPN_DD, L=IN, S=IN, C=IN" -storepass pqcvpn123 -keypass pqcvpn123
          BUILD_TOOLS=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          $BUILD_TOOLS/apksigner sign --ks pqcvpn.keystore --ks-pass pass:pqcvpn123 --key-pass pass:pqcvpn123 --ks-key-alias pqcvpn --out PQCVPN_DD.apk ui/build/outputs/apk/release/ui-release-unsigned.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PQCVPN_DD
          path: PQCVPN_DD.apk
