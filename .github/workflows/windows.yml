name: Build PQCVPN_DD Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Download WireGuard
        run: |
          Invoke-WebRequest -Uri "https://download.wireguard.com/windows-client/wireguard-installer.exe" -OutFile "wireguard-installer.exe"

      - name: Create setup.iss
        shell: cmd
        run: |
          echo [Setup] > setup.iss
          echo AppName=PQCVPN_DD >> setup.iss
          echo AppVersion=1.0 >> setup.iss
          echo AppPublisher=PQCVPN_DD >> setup.iss
          echo DefaultDirName={autopf}\PQCVPN_DD >> setup.iss
          echo DefaultGroupName=PQCVPN_DD >> setup.iss
          echo OutputBaseFilename=PQCVPN_DD_Setup >> setup.iss
          echo OutputDir=Output >> setup.iss
          echo Compression=lzma >> setup.iss
          echo SolidCompression=yes >> setup.iss
          echo WizardStyle=modern >> setup.iss
          echo. >> setup.iss
          echo [Languages] >> setup.iss
          echo Name: "english"; MessagesFile: "compiler:Default.isl" >> setup.iss
          echo. >> setup.iss
          echo [Files] >> setup.iss
          echo Source: "wireguard-installer.exe"; DestDir: "{app}"; DestName: "PQCVPN_DD.exe"; Flags: ignoreversion >> setup.iss
          echo. >> setup.iss
          echo [Icons] >> setup.iss
          echo Name: "{autodesktop}\PQCVPN_DD"; Filename: "{app}\PQCVPN_DD.exe" >> setup.iss
          echo Name: "{group}\PQCVPN_DD"; Filename: "{app}\PQCVPN_DD.exe" >> setup.iss
          echo. >> setup.iss
          echo [Run] >> setup.iss
          echo Filename: "{app}\PQCVPN_DD.exe"; Description: "PQCVPN_DD launch karo"; Flags: nowait postinstall skipifsilent >> setup.iss

      - name: Build EXE
        shell: cmd
        run: |
          mkdir Output
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: PQCVPN_DD_Windows_Setup
          path: Output/PQCVPN_DD_Setup.exe
