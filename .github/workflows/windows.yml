name: Build PQCVPN_DD Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Download WireGuard installer
        run: |
          Invoke-WebRequest -Uri "https://download.wireguard.com/windows-client/wireguard-installer.exe" -OutFile "wireguard-installer.exe"

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Create installer script
        run: |
          $iss = @"
          [Setup]
          AppName=PQCVPN_DD
          AppVersion=1.0
          AppPublisher=PQCVPN_DD
          DefaultDirName={autopf}\PQCVPN_DD
          DefaultGroupName=PQCVPN_DD
          OutputBaseFilename=PQCVPN_DD_Setup
          OutputDir=Output
          Compression=lzma
          SolidCompression=yes
          WizardStyle=modern

          [Languages]
          Name: "english"; MessagesFile: "compiler:Default.isl"

          [Files]
          Source: "wireguard-installer.exe"; DestDir: "{app}"; DestName: "PQCVPN_DD_engine.exe"; Flags: ignoreversion

          [Icons]
          Name: "{autodesktop}\PQCVPN_DD"; Filename: "{app}\PQCVPN_DD_engine.exe"
          Name: "{group}\PQCVPN_DD"; Filename: "{app}\PQCVPN_DD_engine.exe"

          [Run]
          Filename: "{app}\PQCVPN_DD_engine.exe"; Description: "PQCVPN_DD setup complete karo"; Flags: nowait postinstall skipifsilent
          "@
          New-Item -Path "." -Name "setup.iss" -ItemType "file" -Value $iss

      - name: Build EXE
        run: |
          mkdir Output
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: PQCVPN_DD_Windows_Setup
          path: Output\PQCVPN_DD_Setup.exe
